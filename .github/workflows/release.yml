name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tags aren't tied to a branch, so only release tags whose commit is on main.
      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Package
        run: |
          (cd dist && zip -r "../vivaldi-manager-extension-$GITHUB_REF_NAME.zip" .)
          cp vivaldi/vivaldi-manager.js "vivaldi-manager-mod-$GITHUB_REF_NAME.js"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "vivaldi-manager-extension-$GITHUB_REF_NAME.zip" \
            "vivaldi-manager-mod-$GITHUB_REF_NAME.js"
